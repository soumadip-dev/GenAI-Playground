<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Paper Summarizer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #eef2f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 500px;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    label {
      display: block;
      margin: 15px 0 8px;
      font-weight: bold;
      color: #444;
    }

    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #007BFF;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: .3s;
    }

    button:hover {
      background: #0056b3;
    }

    button:disabled {
      background: gray;
      cursor: not-allowed;
    }

    #output {
      margin-top: 25px;
      background: #f7f7f7;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.6;
      min-height: 100px;
      border: 1px solid #ddd;
    }
  </style>

</head>

<body>

  <div class="container">

    <h1>Research Tool</h1>

    <label>Research Paper</label>
    <select id="paper">
      <option>Attention Is All You Need</option>
      <option>BERT: Pre-training of Deep Bidirectional Transformers</option>
      <option>GPT-3: Language Models are Few-Shot Learners</option>
      <option>Diffusion Models Beat GANs on Image Synthesis</option>
    </select>

    <label>Explanation Style</label>
    <select id="style">
      <option>Beginner-Friendly</option>
      <option>Technical</option>
      <option>Code-Oriented</option>
      <option>Mathematical</option>
    </select>

    <label>Explanation Length</label>
    <select id="length">
      <option>Short (1-2 paragraphs)</option>
      <option>Medium (3-5 paragraphs)</option>
      <option>Long (Detailed Explanation)</option>
    </select>

    <button id="summarizeBtn">Summarize</button>

    <div id="output">
      Select options and click <b>Summarize</b>.
    </div>

  </div>

  <script>
    const btn = document.getElementById("summarizeBtn");

    btn.addEventListener("click", async () => {

      const paper = document.getElementById("paper").value;
      const style = document.getElementById("style").value;
      const length = document.getElementById("length").value;
      const output = document.getElementById("output");

      btn.disabled = true;
      btn.innerText = "Generating...";
      output.innerHTML = "Please wait...";

      try {

        const response = await fetch("http://127.0.0.1:5000/summarize", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            paper_input: paper,
            style_input: style,
            length_input: length
          })
        });

        const data = await response.json();

        output.innerHTML = data.summary;

      } catch (error) {

        output.innerHTML = "❌ Error connecting to the backend.";

      }

      btn.disabled = false;
      btn.innerText = "Summarize";

    });
  </script>

</body>

</html>
