<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Interface</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body
  class="bg-neutral-950 text-neutral-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200 overflow-x-hidden">
  <!-- Top Sticky Header -->
  <header class="sticky top-0 z-10 border-b border-neutral-800/80 bg-neutral-950/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2.5">
        <div
          class="flex h-8 w-8 items-center justify-center rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 text-white shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4">
            <path fill-rule="evenodd"
              d="M9 4.5a.75.75 0 01.721.544l.813 2.846a3.75 3.75 0 002.576 2.576l2.846.813a.75.75 0 010 1.442l-2.846.813a3.75 3.75 0 00-2.576 2.576l-.813 2.846a.75.75 0 01-1.442 0l-.813-2.846a3.75 3.75 0 00-2.576-2.576l-2.846-.813a.75.75 0 010-1.442l2.846-.813A3.75 3.75 0 007.466 7.89l.813-2.846A.75.75 0 019 4.5z"
              clip-rule="evenodd" />
          </svg>
        </div>
        <div>
          <h1 class="text-sm font-semibold tracking-tight text-neutral-100">AI Assistant</h1>
          <p class="flex items-center gap-1.5 text-[11px] text-neutral-400">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span> Online
          </p>
        </div>
      </div>

      <button id="clear-btn" type="button" title="Clear chat"
        class="rounded-lg px-2.5 py-1.5 text-xs font-medium text-neutral-400 hover:bg-neutral-800/80 hover:text-neutral-200 transition-colors cursor-pointer">
        New Chat
      </button>
    </div>
  </header>

  <main class="container mx-auto flex min-h-[calc(100vh-57px)] max-w-3xl flex-col px-4 pt-6 pb-44">
    <!-- Empty State Welcome Screen -->
    <div id="empty-state" class="my-auto flex flex-col items-center justify-center text-center py-12">
      <div
        class="mb-4 flex h-12 w-12 items-center justify-center rounded-2xl border border-neutral-800 bg-neutral-900 text-indigo-400 shadow-inner">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="h-6 w-6">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M7.5 8.25h9m-9 3H12m-9.75 1.51c0 1.6 1.123 2.994 2.707 3.227 1.129.166 2.27.293 3.423.379.35.026.67.21.865.501L12 21l2.755-4.133a1.14 1.14 0 01.865-.501 48.172 48.172 0 003.423-.379c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z" />
        </svg>
      </div>
      <h2 class="text-xl font-semibold tracking-tight text-neutral-100">How can I help you today?</h2>
      <p class="mt-1.5 max-w-md text-sm text-neutral-400">
        Ask a question, brainstorm ideas, or paste code to get started.
      </p>

      <!-- Quick Prompt Suggestions -->
      <div class="mt-6 flex flex-wrap justify-center gap-2">
        <button type="button" data-prompt="Explain quantum computing in simple terms"
          class="suggestion-chip rounded-full border border-neutral-800 bg-neutral-900/70 px-3.5 py-1.5 text-xs text-neutral-300 hover:border-neutral-700 hover:bg-neutral-800 transition-colors cursor-pointer">
          Explain quantum computing
        </button>
        <button type="button" data-prompt="Give me 3 productivity tips for developers"
          class="suggestion-chip rounded-full border border-neutral-800 bg-neutral-900/70 px-3.5 py-1.5 text-xs text-neutral-300 hover:border-neutral-700 hover:bg-neutral-800 transition-colors cursor-pointer">
          Developer productivity tips
        </button>
        <button type="button" data-prompt="Write a clean JavaScript debounce function"
          class="suggestion-chip rounded-full border border-neutral-800 bg-neutral-900/70 px-3.5 py-1.5 text-xs text-neutral-300 hover:border-neutral-700 hover:bg-neutral-800 transition-colors cursor-pointer">
          JS debounce snippet
        </button>
      </div>
    </div>

    <!-- Chat Messages Container -->
    <div id="chat-container" class="flex w-full flex-col gap-5">
      <!-- Messages will be generated by JS -->
    </div>
  </main>

  <!-- Fixed Input Area with smooth gradient fade -->
  <div
    class="fixed inset-x-0 bottom-0 bg-gradient-to-t from-neutral-950 via-neutral-950/95 to-transparent pt-8 pb-5 px-4">
    <div
      class="mx-auto w-full max-w-3xl rounded-3xl border border-neutral-800 bg-neutral-900/90 p-3 shadow-2xl backdrop-blur-md focus-within:border-neutral-600 focus-within:ring-1 focus-within:ring-neutral-600/50 transition-all">
      <textarea id="input" rows="1" placeholder="Ask anything..." aria-label="Prompt input"
        class="max-h-40 w-full resize-none overflow-y-auto bg-transparent px-2.5 py-1 text-sm sm:text-base leading-relaxed text-neutral-100 placeholder-neutral-500 outline-none"></textarea>
      <div class="mt-2 flex items-center justify-between pt-1">
        <span class="hidden px-2.5 text-xs text-neutral-500 sm:inline">
          <kbd
            class="rounded border border-neutral-700/80 bg-neutral-800 px-1.5 py-0.5 font-sans text-[10px] text-neutral-400">Enter</kbd>
          to send &middot;
          <kbd
            class="rounded border border-neutral-700/80 bg-neutral-800 px-1.5 py-0.5 font-sans text-[10px] text-neutral-400">Shift
            + Enter</kbd> for new line
        </span>
        <button id="ask-btn" type="button" disabled
          class="ml-auto inline-flex items-center gap-1.5 rounded-full bg-white px-4 py-1.5 text-sm font-semibold text-neutral-950 shadow-sm hover:bg-neutral-200 active:scale-95 disabled:cursor-not-allowed disabled:opacity-40 transition-all cursor-pointer">
          <span>Send</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4">
            <path
              d="M3.105 2.289a.75.75 0 00-.826.95l1.414 4.925A1.5 1.5 0 005.135 9.25h6.115a.75.75 0 010 1.5H5.135a1.5 1.5 0 00-1.442 1.086l-1.414 4.926a.75.75 0 00.826.95 28.896 28.896 0 0015.293-7.154.75.75 0 000-1.115A28.897 28.897 0 003.105 2.289z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
